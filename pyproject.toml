[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bike-tracker"
version = "0.1.0"
description = "Record bike-to-work days using an Apple Find My accessory"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "findmy==0.10.2",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
bike-tracker = "bike_tracker.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
